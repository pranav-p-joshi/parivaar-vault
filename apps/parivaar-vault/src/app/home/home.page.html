<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Parivaar Vault</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Parivaar Vault</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-icon name="shield-checkmark-outline" class="hero-icon"></ion-icon>
      <ion-card-title>Welcome to Parivaar Vault</ion-card-title>
      <ion-card-subtitle>Ionic + Capacitor + Angular</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      This app is generated inside the Nx workspace. Edit
      <code>apps/parivaar-vault/src/app/home</code> to get started.
      <ion-button expand="block" class="ion-margin-top">Get started</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
